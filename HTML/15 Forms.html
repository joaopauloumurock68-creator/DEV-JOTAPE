<!--FORMS
-CAPTURAR DADOS DE ENTRADA
-INPUT-> ENTRADA
ACTION -> DEFINE PARA QUAL URL SERÁ ENVIADO OS DADOS, VAZIO ENVIA PARA MESMA URL
METHOD
- GET
- POST
-->

  <form action="" method="get" enctype="multipart/form-data"> <!--ENCTYPE É PARA AJUDAR A ENVIAR ARQUIVO VIA FORMULÁRIO JUNTAMENTE COM AS OUTRA INFORMAÇÕES-->
        <h1>Digite seu Endereço</h1>
        <label>
            Rua:
            <input type="text" name="rua" autocomplete="street-address">
        </label>

        <label>
            Número:
            <input type="number" name="numero">
        </label>

        <label>
            Email:
            <input type="email" name="email">
        </label>
        
        <label>
            Arquivo:
            <input type="file" name="arquivo">
        </label>

        <button TYPE="RESET">Reset</button>
        <button type="submit">Enviar dados</button>



  </form>
